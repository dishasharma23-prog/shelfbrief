name: Weekly shelf scrape

on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 08:47 IST
  workflow_dispatch:           # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Keep the current site data to fall back on
        run: cp web/data/site.json /tmp/site.previous.json
      - name: Scrape, clean and write briefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional: briefs fall back to rules without it
        run: python -m shelfbrief run
      # Stores often rate-limit cloud IPs. A thin run must not replace a good dataset on the live site.
      - name: Only keep the new data if the run came back healthy
        id: check
        run: |
          python - <<'PY'
          import json, os
          new = json.load(open("web/data/site.json", encoding="utf-8"))
          old = json.load(open("/tmp/site.previous.json", encoding="utf-8"))
          n_new, n_old = len(new.get("products", [])), len(old.get("products", []))
          ok = n_new >= max(50, int(n_old * 0.6)) and len(new.get("briefs", [])) > 0
          print(f"products: {n_old} -> {n_new}; keeping new data: {ok}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
          PY
      - name: Commit the new data
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name "shelfbrief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.csv data/products.json data/briefs.json data/run.json web/data/site.json
          git diff --cached --quiet || git commit -m "data: weekly shelf scrape $(date -u +%F)"
          git push
